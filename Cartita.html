<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Ti ❤️</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
</head>

<style>

/* Variables de color */
:root {
    --primary-color: #ff6b9d;
    --secondary-color: #d81b60;
    --accent-color: #ff8fab;
    --text-color: #2c1810;
    --light-text: #fff5f8;
    --background-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #ff6b9d 100%);
    --glass-bg: rgba(255, 255, 255, 0.15);
    --glass-border: rgba(255, 255, 255, 0.3);
}

/* Reset y estilos base */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Cormorant Garamond', serif;
    background: var(--background-gradient);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
    position: relative;
}

/* Contenedor de corazones flotantes */
.hearts-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
}

.heart {
    position: absolute;
    font-size: 20px;
    animation: floatHeart 15s infinite ease-in-out;
    opacity: 0.6;
}

@keyframes floatHeart {
    0% {
        transform: translateY(100vh) rotate(0deg);
        opacity: 0;
    }
    10% {
        opacity: 0.6;
    }
    90% {
        opacity: 0.6;
    }
    100% {
        transform: translateY(-100px) rotate(360deg);
        opacity: 0;
    }
}

/* Contenedor principal */
.container {
    position: relative;
    z-index: 1;
    max-width: 1200px;
    width: 95%;
    padding: 40px 20px;
    text-align: center;
}

/* Contenedor principal con imágenes y carta */
.main-content {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 30px;
    margin: 40px 0;
    flex-wrap: wrap;
}

/* Imágenes laterales */
.side-image {
    flex: 0 0 auto;
    width: 200px;
    animation: floatSide 3s ease-in-out infinite;
}

.side-image img {
    width: 100%;
    height: auto;
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(5px);
    padding: 10px;
}

.side-image img:hover {
    transform: scale(1.1) rotate(5deg);
    box-shadow: 0 12px 35px rgba(0, 0, 0, 0.4);
}

.side-image.left {
    animation-delay: 0s;
}

.side-image.right {
    animation-delay: 1.5s;
}

@keyframes floatSide {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-15px);
    }
}

/* Contenedor de la carta */
.letter-container {
    perspective: 1000px;
    flex: 1;
    min-width: 300px;
    max-width: 600px;
}

/* Título */
.title {
    font-family: 'Dancing Script', cursive;
    font-size: 4rem;
    color: var(--light-text);
    margin-bottom: 40px;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    animation: fadeInDown 1s ease-out;
}

@keyframes fadeInDown {
    from {
        opacity: 0;
        transform: translateY(-30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Contenedor de la carta */
.letter-container {
    perspective: 1000px;
    margin-bottom: 30px;
}

.letter {
    background: #fffef8;
    background-image: repeating-linear-gradient(
        transparent,
        transparent 31px,
        #e8e4d9 31px,
        #e8e4d9 32px
    );
    border: 3px solid #d4c4a8;
    border-radius: 5px;
    padding: 50px 40px 40px 40px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3), inset 0 0 20px rgba(0, 0, 0, 0.05);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    min-height: 350px;
    position: relative;
    overflow: hidden;
}

/* Decoraciones en las esquinas */
.letter::before {
    content: '❤️';
    position: absolute;
    top: 10px;
    left: 15px;
    font-size: 1.5rem;
    opacity: 0.7;
}

.letter::after {
    content: '❤️';
    position: absolute;
    top: 10px;
    right: 15px;
    font-size: 1.5rem;
    opacity: 0.7;
}

/* Decoración inferior izquierda - usando un elemento adicional */
.letter .corner-decoration-left {
    content: '💕';
    position: absolute;
    bottom: 10px;
    left: 15px;
    font-size: 1.5rem;
    opacity: 0.7;
    pointer-events: none;
}

/* Decoración inferior derecha - usando un elemento adicional */
.letter .corner-decoration-right {
    content: '💕';
    position: absolute;
    bottom: 10px;
    right: 15px;
    font-size: 1.5rem;
    opacity: 0.7;
    pointer-events: none;
}

/* Decoraciones de hojas exteriores */
.leaf-decoration {
    position: absolute;
    font-size: 2rem;
    opacity: 0.8;
    pointer-events: none;
    z-index: -1;
}

.leaf-top-left {
    top: -15px;
    left: -15px;
    transform: rotate(-45deg);
}

.leaf-top-right {
    top: -15px;
    right: -15px;
    transform: rotate(45deg);
}

.leaf-bottom-left {
    bottom: -15px;
    left: -15px;
    transform: rotate(-135deg);
}

.leaf-bottom-right {
    bottom: -15px;
    right: -15px;
    transform: rotate(135deg);
}

.letter:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
}

/* Contenido de la carta */
.letter-content {
    font-size: 1.4rem;
    line-height: 2;
    color: #2c1810;
    text-align: left;
    min-height: 200px;
    position: relative;
}

.letter-line {
    margin-bottom: 15px;
    opacity: 0;
    transform: translateX(-20px);
    animation: slideIn 0.5s ease-out forwards;
}

@keyframes slideIn {
    to {
        opacity: 1;
        transform: translateX(0);
    }
}

.letter-line .cursor {
    display: inline-block;
    width: 3px;
    height: 1.4rem;
    background-color: #2c1810;
    margin-left: 2px;
    animation: blink 0.7s infinite;
    vertical-align: middle;
}

@keyframes blink {
    0%, 100% {
        opacity: 1;
    }
    50% {
        opacity: 0;
    }
}

/* Botón de sorpresa */
.surprise-btn {
    font-family: 'Dancing Script', cursive;
    font-size: 1.8rem;
    background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
    color: white;
    border: none;
    padding: 15px 40px;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(216, 27, 96, 0.4);
    transition: all 0.3s ease;
    animation: pulse 2s infinite;
}

.surprise-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 6px 20px rgba(216, 27, 96, 0.6);
}

@keyframes pulse {
    0%, 100% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.02);
    }
}

/* Contenedor de sorpresa */
.surprise-container {
    margin-top: 40px;
    animation: fadeIn 1s ease-out;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.surprise-content {
    background: var(--glass-bg);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
}

.surprise-title {
    font-family: 'Dancing Script', cursive;
    font-size: 3rem;
    color: var(--light-text);
    margin-bottom: 20px;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
}

.surprise-image {
    margin: 20px 0;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
}

.surprise-image img {
    width: 100%;
    height: auto;
    display: block;
    transition: transform 0.3s ease;
}

.surprise-image img:hover {
    transform: scale(1.05);
}

.surprise-message {
    font-size: 1.5rem;
    color: var(--light-text);
    margin-top: 20px;
    font-style: italic;
}

/* Imagen decorativa inferior */
.bottom-image {
    margin: 30px auto;
    max-width: 300px;
    animation: bounce 2s ease-in-out infinite;
}

.bottom-image img {
    width: 100%;
    height: auto;
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
    transition: transform 0.3s ease;
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(5px);
    padding: 10px;
}

.bottom-image img:hover {
    transform: scale(1.05);
}

@keyframes bounce {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-10px);
    }
}

/* Responsive */
@media (max-width: 768px) {
    .title {
        font-size: 2.5rem;
    }
    
    .main-content {
        flex-direction: column;
        gap: 20px;
    }
    
    .side-image {
        width: 150px;
    }
    
    .letter-container {
        max-width: 100%;
    }
    
    .letter {
        padding: 25px;
    }
    
    .letter-content {
        font-size: 1.2rem;
    }
    
    .surprise-title {
        font-size: 2rem;
    }
    
    .surprise-btn {
        font-size: 1.4rem;
        padding: 12px 30px;
    }
    
    .bottom-image {
        max-width: 200px;
    }
}

@media (max-width: 480px) {
    .container {
        padding: 20px 10px;
    }
    
    .title {
        font-size: 2rem;
        margin-bottom: 25px;
    }
    
    .side-image {
        width: 120px;
    }
    
    .letter {
        padding: 20px;
        min-height: 250px;
    }
    
    .letter-content {
        font-size: 1rem;
    }
    
    .surprise-btn {
        font-size: 1.2rem;
        padding: 10px 25px;
    }
    
    .bottom-image {
        max-width: 150px;
    }
}


</style>

<body>
    <!-- Contenedor de corazones flotantes -->
    <div class="hearts-container" id="heartsContainer"></div>
    
    <!-- Contenedor principal -->
    <div class="container">
        <!-- Título -->
        <h1 class="title">Para Mi Amor <33</h1>
        
        <!-- Contenedor con imágenes y carta -->
        <div class="main-content">
            <!-- Imagen izquierda -->
            <div class="side-image left">
                <img src="https://i.pinimg.com/474x/24/db/83/24db839c979158d4e914a93095dd9ef4.jpg" alt="Gatitos enamorados 1">
            </div>
            
            <!-- Carta central -->
            <div class="letter-container">
                <div class="letter">
                    <span class="corner-decoration-left">💕</span>
                    <span class="corner-decoration-right">💕</span>
                    <div class="letter-content" id="letterContent">
                        <!-- Las líneas se escribirán aquí con JavaScript -->
                    </div>
                </div>
            </div>
            
            <!-- Imagen derecha -->
            <div class="side-image right">
                <img src="https://i.pinimg.com/474x/50/c2/24/50c224e955738a15ac7703a1935f21ef.jpg" alt="Gatitos enamorados 2">
            </div>
        </div>
        
        <!-- Imagen decorativa inferior -->
        <div class="bottom-image">
            <img src="https://img.magnific.com/vector-premium/ilustracion-doodle-dibujos-animados-lindo-gato-gatito-pareja_40564-560.jpg" alt="Gatitos enamorados 3">
        </div>
        
        <!-- Botón de sorpresa -->
        <button class="surprise-btn" id="surpriseBtn" style="display: none;">
            ✨ Toca Aqui ✨
        </button>
        
        <!-- Contenedor de sorpresa -->
        <div class="surprise-container" id="surpriseContainer" style="display: none;">
            <div class="surprise-content">
                <h2 class="surprise-title">Para tuu MI AMOR</h2>
                <div class="surprise-image">
                    <img src="https://i.pinimg.com/originals/ad/25/49/ad2549bb6fabbcdb6e19ccc9b0d1f406.png" alt="Gatito">
                </div>
                <p class="surprise-message">TE AMO MUSHO 😻</p>
            </div>
        </div>
    </div>
    
    <script>

        // ==========================================
// CONFIGURACIÓN DEL MENSAJE
// ==========================================
// Escribe tu mensaje personalizado aquí
// Cada línea del array será un párrafo separado
const letterLines = [
    "Mi niña..",
    "",
    "Desde que estas en mi vida, todo ha sido diferente, has hecho que valga la pena cada segundo junto a ti.",
    "",
    "Aunque no podamos estar fisicamente juntos, yo te tengo conmigo siempre en mis pensamientos.",
    "",
    "Eres la niña mas especial que he conocido y la mas importante que tengo en mi vida, te amo como no te imaginas.",
    "",
    "Me has demostrado un amor inmenso y que me ha hecho sentir de la manera más bonita haciendo que cada dia te ame más y másss ❤️💫",
    "",
    "Espero hacerte sentir de la misma manera, porque tu te mereces eso y más mi cielito lindo.",
    "",
    "No tengo palabras para describirte cada cosa que me haces sentir en mi asi que me esfuerzo por demostrartelo cada dia.",
    "",
    "Eres tan hermosaaa y tan cariñosa que aun me cuesta creer que es real y que realmente soy tu novioo asi que me siento demasiado afortunado.",
    "",
    "Te amo y nunca me voy a cansar de decirtelo, porque el amor que te tengo es tanto que ni miles de te amos pueden alcanzar a describir lo mucho que lo hago.",
    "",
    "Voy a estar para ti siempre que lo necesites hasta en los momentos mas dificiles puedes contar conmigo, te lo prometo. 💕",
    "",
    "Eres lo mas hermoso que me ha pasado en la vida y no me quiero imaginar sin ti.",
    "",
    "Te amo demasiado mi niña preciosa, eres mi todo. ❤️",

];

// Velocidad de escritura (milisegundos entre cada carácter)
// Menor número = más rápido, Mayor número = más lento
const typingSpeed = 40;

// ==========================================
// CORAZONES FLOTANTES
// ==========================================
function createFloatingHearts() {
    const container = document.getElementById('heartsContainer');
    const heartSymbols = ['❤️', '💕', '💖', '💗', '💝', '💘'];
    
    // Crear corazones periódicamente
    setInterval(() => {
        const heart = document.createElement('div');
        heart.className = 'heart';
        heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
        
        // Posición aleatoria horizontal
        heart.style.left = Math.random() * 100 + '%';
        
        // Tamaño aleatorio
        const size = Math.random() * 20 + 15;
        heart.style.fontSize = size + 'px';
        
        // Duración aleatoria de la animación
        const duration = Math.random() * 10 + 10;
        heart.style.animationDuration = duration + 's';
        
        container.appendChild(heart);
        
        // Eliminar el corazón después de la animación
        setTimeout(() => {
            heart.remove();
        }, duration * 1000);
    }, 500);
}

// ==========================================
// EFECTO DE MÁQUINA DE ESCRIBIR
// ==========================================
async function typeText(element, text, speed) {
    for (let i = 0; i < text.length; i++) {
        element.textContent += text.charAt(i);
        await new Promise(resolve => setTimeout(resolve, speed));
    }
}

async function typeLine(lineElement, text, speed) {
    // Crear cursor
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    lineElement.appendChild(cursor);
    
    // Escribir el texto
    await typeText(lineElement, text, speed);
    
    // Eliminar cursor
    cursor.remove();
}

async function writeLetter() {
    const letterContent = document.getElementById('letterContent');
    
    for (let i = 0; i < letterLines.length; i++) {
        // Crear elemento para la línea
        const lineElement = document.createElement('p');
        lineElement.className = 'letter-line';
        letterContent.appendChild(lineElement);
        
        // Escribir la línea
        await typeLine(lineElement, letterLines[i], typingSpeed);
        
        // Pausa entre líneas
        await new Promise(resolve => setTimeout(resolve, 300));
    }
    
    // Mostrar botón de sorpresa después de terminar
    setTimeout(() => {
        const surpriseBtn = document.getElementById('surpriseBtn');
        surpriseBtn.style.display = 'inline-block';
    }, 500);
}

// ==========================================
// SORPRESA
// ==========================================
function showSurprise() {
    const surpriseContainer = document.getElementById('surpriseContainer');
    const surpriseBtn = document.getElementById('surpriseBtn');
    
    // Ocultar botón
    surpriseBtn.style.display = 'none';
    
    // Mostrar sorpresa
    surpriseContainer.style.display = 'block';
    
    // Crear explosión de corazones
    createHeartExplosion();
}

function createHeartExplosion() {
    const container = document.getElementById('heartsContainer');
    const heartSymbols = ['❤️', '💕', '💖', '💗', '💝', '💘', '✨', '💫'];
    
    for (let i = 0; i < 50; i++) {
        setTimeout(() => {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
            
            // Posición desde el centro
            heart.style.left = '50%';
            heart.style.top = '50%';
            
            // Tamaño aleatorio
            const size = Math.random() * 30 + 20;
            heart.style.fontSize = size + 'px';
            
            // Dirección aleatoria
            const angle = Math.random() * Math.PI * 2;
            const distance = Math.random() * 300 + 100;
            const endX = Math.cos(angle) * distance;
            const endY = Math.sin(angle) * distance;
            
            // Animación personalizada
            heart.style.transition = 'all 1s ease-out';
            heart.style.transform = 'translate(-50%, -50%)';
            
            container.appendChild(heart);
            
            // Mover el corazón
            setTimeout(() => {
                heart.style.transform = `translate(calc(-50% + ${endX}px), calc(-50% + ${endY}px))`;
                heart.style.opacity = '0';
            }, 50);
            
            // Eliminar después de la animación
            setTimeout(() => {
                heart.remove();
            }, 1500);
        }, i * 50);
    }
}

// ==========================================
// INICIALIZACIÓN
// ==========================================
document.addEventListener('DOMContentLoaded', () => {
    // Iniciar corazones flotantes
    createFloatingHearts();
    
    // Iniciar escritura de la carta
    setTimeout(writeLetter, 1000);
    
    // Event listener para el botón de sorpresa
    const surpriseBtn = document.getElementById('surpriseBtn');
    surpriseBtn.addEventListener('click', showSurprise);
});




    </script>
</body>
</html>
